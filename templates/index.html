<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول التوقيت والأساتذة</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f4f6f9;
            --text-primary: #212529;
            --card-bg: #ffffff;
            --table-header-bg: #e9ecef;
            --table-row-bg: #ffffff;
            --table-hover: #f1f3f5;
            --border-color: #dee2e6;
            --modal-bg: #ffffff;
            --header-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        [data-theme="dark"] {
            --bg-primary: #121212;
            --text-primary: #f8f9fa;
            --card-bg: #1e1e1e;
            --table-header-bg: #2d3748;
            --table-row-bg: #1e1e1e;
            --table-hover: #2d2d2d;
            --border-color: #383838;
            --modal-bg: #252525;
            --header-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-bg {
            background: var(--header-gradient);
            color: white;
            padding: 25px 15px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 30px;
        }

        .card-custom {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.3s;
        }

        .table {
            color: var(--text-primary) !important;
            border-color: var(--border-color) !important;
            margin-bottom: 0;
        }

        .table th {
            background-color: var(--table-header-bg) !important;
            color: var(--text-primary) !important;
            border-color: var(--border-color) !important;
        }

        .table td {
            background-color: var(--table-row-bg) !important;
            color: var(--text-primary) !important;
            border-color: var(--border-color) !important;
            vertical-align: middle;
        }

        .table tbody tr:hover td {
            background-color: var(--table-hover) !important;
        }

        .badge-present {
            background-color: #28a745 !important;
            color: #ffffff !important;
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .badge-absent {
            background-color: #dc3545 !important;
            color: #ffffff !important;
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .btn-specialty {
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 10px;
            font-weight: bold;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .modal-content {
            background-color: var(--modal-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .form-control, .form-select {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
    </style>
</head>
<body>

    <div class="header-bg">
        <div class="container d-flex flex-column align-items-center text-center position-relative">
            <div class="w-100 d-flex justify-content-end mb-2">
                <button class="theme-toggle-btn" onclick="toggleTheme()">
                    <i id="themeIcon" class="fa-solid fa-moon me-1"></i>
                    <span id="themeText">الوضع الداكن</span>
                </button>
            </div>

            <h2><i class="fa-solid fa-graduation-cap me-2"></i>منصة جدول التوقيت الجامعي</h2>
            <p class="mb-0 text-white-50">متابعة الحصص ومواقع القاعات وحالة الأساتذة المباشرة</p>
        </div>
    </div>

    <div class="container mb-5">
        <!-- قسم اختيار التخصص -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-10 text-center">
                <div class="card card-custom p-4">
                    <h5 class="mb-3">اختر نوع الاستخدام للبدء:</h5>
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <button onclick="selectSpecialty('تسيير المنشآت الرياضية')" class="btn btn-primary btn-specialty">
                            <i class="fa-solid fa-building-columns me-2"></i>تسيير المنشآت الرياضية
                        </button>
                        <button onclick="selectSpecialty('تدريب رياضي')" class="btn btn-success btn-specialty">
                            <i class="fa-solid fa-dumbbell me-2"></i>تدريب رياضي
                        </button>
                        <button class="btn btn-outline-info btn-specialty" data-bs-toggle="modal" data-bs-target="#profModal">
                            <i class="fa-solid fa-user-tie me-2"></i>فضاء الأساتذة
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ملخص الحصة القادمة / الحالية -->
        <div id="nextClassContainer" class="row justify-content-center mb-4 d-none">
            <div class="col-md-10">
                <div class="card card-custom p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span id="classStatusBadge" class="badge bg-primary mb-2">الحصة القادمة/الحالية</span>
                            <h4 id="nextSubject" class="mb-1">--</h4>
                            <p id="nextDetails" class="text-secondary mb-0">--</p>
                        </div>
                        <div id="nextMapBtn"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- جدول الحصص -->
        <div id="scheduleContainer" class="row justify-content-center d-none">
            <div class="col-md-10">
                <div class="card card-custom p-4">
                    <h4 id="selectedTitle" class="text-center mb-4 text-primary"></h4>
                    <div class="table-responsive">
                        <table class="table align-middle text-center border">
                            <thead>
                                <tr>
                                    <th>الفوج</th>
                                    <th>اليوم</th>
                                    <th>المادة</th>
                                    <th>الأستاذ</th>
                                    <th>التوقيت</th>
                                    <th>المكان (Google Maps)</th>
                                    <th>حالة الأستاذ</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleBody">
                                <!-- البيانات تُملأ ديناميكياً مع دمج الخلايا المتكررة -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة دخول الأستاذ Modal -->
    <div class="modal fade" id="profModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-user-lock me-2"></i>تسجيل دخول الأستاذ</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="profForm">
                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" id="profEmail" class="form-control" placeholder="example@univ.dz" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" id="profPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تحديث الحالة</label>
                            <select id="profStatus" class="form-select">
                                <option value="حاضر">حاضر ✅</option>
                                <option value="غائب">غائب ❌</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">تحديث الحالة الآن</button>
                    </form>
                    <div id="profAlert" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let fullSchedule = [];
        let professorsMap = {};

        const weekDaysOrder = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

        async function loadData() {
            try {
                const res = await fetch('/api/schedule');
                const data = await res.json();
                if (data.success) {
                    fullSchedule = data.schedule;
                    professorsMap = data.professors;
                }
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function getProfStatus(profName) {
            for (let email in professorsMap) {
                if (email.includes("hamani") && profName.includes("حماني")) return professorsMap[email];
                if (email.includes("aittahar") && profName.includes("أيت طاهر")) return professorsMap[email];
                if (email.includes("haddach") && profName.includes("حداش")) return professorsMap[email];
                if (email.includes("toutaoui") && profName.includes("طوطاوي")) return professorsMap[email];
                if (email.includes("zaoui") && profName.includes("زاوي")) return professorsMap[email];
            }
            return "حاضر";
        }

        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const clean = timeStr.trim().replace(';', ':');
            const parts = clean.split(':');
            if (parts.length < 2) return 0;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function selectSpecialty(spec) {
            document.getElementById('selectedTitle').innerText = "جدول توقيت تخصص: " + spec;
            document.getElementById('scheduleContainer').classList.remove('d-none');
            
            const filtered = fullSchedule.filter(item => item.specialty && item.specialty.includes(spec));
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            // حساب عدد التكرارات المتتالية لخانة الفوج واليوم لدمجهما بـ rowspan
            let i = 0;
            while (i < filtered.length) {
                const currentItem = filtered[i];
                let daySpan = 1;

                // حساب كم سطر متتالي يحتوي على نفس اليوم والأوج
                while (
                    i + daySpan < filtered.length &&
                    filtered[i + daySpan].day.trim() === currentItem.day.trim() &&
                    filtered[i + daySpan].group.trim() === currentItem.group.trim()
                ) {
                    daySpan++;
                }

                // رسم الأسطر مع دمج خلية اليوم والأوج للسطر الأول من المجموعة
                for (let j = 0; j < daySpan; j++) {
                    const item = filtered[i + j];
                    const status = getProfStatus(item.prof);
                    const badgeClass = status === 'حاضر' ? 'badge-present' : 'badge-absent';

                    let rowHTML = '<tr>';

                    // إضافة خلية الفوج واليوم مدمجة فقط في أول سطر من المجموعة
                    if (j === 0) {
                        rowHTML += `<td rowspan="${daySpan}"><span class="badge bg-secondary">${item.group}</span></td>`;
                        rowHTML += `<td rowspan="${daySpan}" class="fw-bold">${item.day}</td>`;
                    }

                    rowHTML += `
                        <td class="fw-bold">${item.subject}</td>
                        <td>${item.prof}</td>
                        <td>${item.startTime} - ${item.endTime}</td>
                        <td>
                            <a href="${item.mapUrl}" target="_blank" class="btn btn-sm btn-outline-danger">
                                <i class="fa-solid fa-location-dot me-1"></i>${item.room}
                            </a>
                        </td>
                        <td><span class="badge ${badgeClass}">${status}</span></td>
                    </tr>`;

                    tbody.innerHTML += rowHTML;
                }

                i += daySpan;
            }

            // تحديد الحصة التفاعلية القادمة
            const now = new Date();
            const currentDayIndex = now.getDay();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let nextClass = null;

            const todayName = weekDaysOrder[currentDayIndex];
            const todayClasses = filtered.filter(item => item.day && item.day.trim().includes(todayName));
            nextClass = todayClasses.find(item => timeToMinutes(item.endTime) > currentMinutes);

            if (!nextClass) {
                for (let k = 1; k <= 6; k++) {
                    const checkDayIndex = (currentDayIndex + k) % 7;
                    const checkDayName = weekDaysOrder[checkDayIndex];
                    const futureClasses = filtered.filter(item => item.day && item.day.trim().includes(checkDayName));
                    if (futureClasses.length > 0) {
                        nextClass = futureClasses[0];
                        break;
                    }
                }
            }

            if (!nextClass && filtered.length > 0) {
                nextClass = filtered[0];
            }

            if (nextClass) {
                document.getElementById('nextClassContainer').classList.remove('d-none');
                document.getElementById('nextSubject').innerText = `${nextClass.subject} (${nextClass.group})`;
                document.getElementById('nextDetails').innerText = `اليوم: ${nextClass.day} | الأستاذ: ${nextClass.prof} | التوقيت: ${nextClass.startTime} - ${nextClass.endTime} | المكان: ${nextClass.room}`;
                document.getElementById('nextMapBtn').innerHTML = `
                    <a href="${nextClass.mapUrl}" target="_blank" class="btn btn-danger">
                        <i class="fa-solid fa-map-location-dot me-2"></i>فتح في Maps
                    </a>
                `;
            } else {
                document.getElementById('nextClassContainer').classList.add('d-none');
            }
        }

        document.getElementById('profForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('profEmail').value;
            const password = document.getElementById('profPassword').value;
            const status = document.getElementById('profStatus').value;
            const alertDiv = document.getElementById('profAlert');

            alertDiv.innerHTML = '<div class="alert alert-info">جاري التحديث...</div>';

            try {
                const res = await fetch('/api/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, status })
                });
                const data = await res.json();
                
                if (data.success) {
                    alertDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                    await loadData();
                } else {
                    alertDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                }
            } catch (err) {
                alertDiv.innerHTML = '<div class="alert alert-danger">حدث خطأ أثناء الاتصال بالسيرفر</div>';
            }
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            
            if (theme === 'dark') {
                icon.className = 'fa-solid fa-sun me-1';
                text.innerText = 'الوضع المضيء';
            } else {
                icon.className = 'fa-solid fa-moon me-1';
                text.innerText = 'الوضع الداكن';
            }
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
            loadData();
        };
    </script>
</body>
</html>
